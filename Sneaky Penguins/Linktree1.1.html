<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linktree1.1</title>
    <link rel="stylesheet" href="Linktree1.css">
</head>
<body>
    <div class="signup-page">
       
        <div class="logo-container">
            <span class="logo-text">Linktree</span>
            <span class="logo-icon">✱</span>
        </div>
        <div class="main-content">
            <div class="title-section">
                <h1 class="main-title">Join Linktree</h1>
                <p class="subtitle">Sign up for free!</p>
            </div>
            <form class="signup-form">
                <div class="form-group">
                    <input type="email" class="form-input" placeholder="Email" required>
                </div>
                <div class="checkbox-container">
                    <input type="checkbox" id="agree" class="custom-checkbox">
                    <label for="agree" class="checkbox-label">
                        I agree to receive offers, news and updates from Linktree.
                    </label>
                </div>
                <button type="submit" class="btn-continue">Continue</button>
                <p class="terms-notice">
                    By clicking <strong>Create account</strong>, you agree to Linktree's 
                    <a href="#" class="link">privacy notice</a>, 
                    <a href="#" class="link">T&Cs</a>, 
                    <a href="#" class="link">cookie notice</a> 
                    and to receive offers, news and updates.
                </p>
                <div class="divider">
                    <span class="divider-text">OR</span>
                </div>
                <button type="button" class="btn-social btn-google">
                    Continue with Google
                </button>
                <button type="button" class="btn-social btn-apple">
                    Continue with Apple
                </button>
            </form>
            <div class="image-right1">
            <img src="SIRGHIE DENISA/Imagine4.1.webp" alt="profile" class="profile-pic">
            </div>
        </div>
    </div>
</body>
</html>
